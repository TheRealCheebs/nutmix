# Taskfile.yml for nutmix project with Docker, Docker Compose, and version management
version: '3'

env:
  # Ensure Go bin is in PATH for all tasks
  PATH: "{{.PATH}}:$(go env GOPATH)/bin"

vars:
  APP_NAME: nutmix
  DOCKER_IMAGE: nutmix
  BUILD_DIR: build
  CGO_ENABLED: 0
  GOOS: linux
  GOARCH: amd64
  RUN_ARGS: ""  # Additional arguments for running the app locally
  VERSION_FILE: VERSION
  VERSION_GO_FILE: internal/version/version.go
  # Read current version from VERSION file
  VERSION:
    sh: cat {{.VERSION_FILE}} 2>/dev/null || echo "0.0.0"
  GO_BIN:
    sh: go env GOPATH
  PROTOC_GEN_GO:
    sh: which protoc-gen-go || echo "$(go env GOPATH)/bin/protoc-gen-go"
  PROTOC_GEN_GO_GRPC:
    sh: which protoc-gen-go-grpc || echo "$(go env GOPATH)/bin/protoc-gen-go-grpc"
  TEMPL_CMD:
    sh: which templ || echo "$(go env GOPATH)/bin/templ"

tasks:
  default:
    cmds:
      - task: help

  help:
    desc: Shows available tasks
    cmds:
      - |
        echo "Available tasks:"
        echo "  build            - Build the application"
        echo "  run              - Build and run the application locally"
        echo "  dev              - Start database and run application locally"
        echo "  deps             - Install required dependencies"
        echo "  gen-proto        - Generate protobuf code"
        echo "  gen-templ        - Generate go code from templ files"
        echo "  gen-test-keys    - Generate test keys for MINT_PRIVATE_KEY and ADMIN_NOSTR_NPUB"
        echo "  test             - Run tests"
        echo "  lint             - Run linter"
        echo "  clean            - Clean build artifacts"
        echo "  version          - Show current version"
        echo "  version-bump     - Bump version (patch by default)"
        echo "  version-set      - Set specific version (e.g., task version-set -- 1.2.3)"
        echo "  version-major    - Bump major version"
        echo "  version-minor    - Bump minor version"
        echo "  version-patch    - Bump patch version"
        echo "  docker-build     - Build Docker image with version tags"
        echo "  docker-run       - Run application in Docker"
        echo "  docker-push      - Push Docker images to registry"
        echo "  docker-clean     - Clean up Docker resources"
        echo "  docker-up        - Start all services with docker-compose"
        echo "  docker-down      - Stop all services"
        echo "  docker-db        - Start only the database service"
        echo "  docker-db-down   - Stop the database service"

  build:
    desc: Build the application
    deps: [gen-proto, gen-templ]
    sources:
      - ./**/*.go
      - ./**/*.templ
      - internal/routes/admin/templates/*.html
    generates:
      - "{{.BUILD_DIR}}/{{.APP_NAME}}"
    cmds:
      - echo "Building {{.APP_NAME}} v{{.VERSION}}..."
      - mkdir -p {{.BUILD_DIR}}
      - go build -a -installsuffix cgo -ldflags '-extldflags "-static"' -o {{.BUILD_DIR}}/{{.APP_NAME}} cmd/nutmix/*.go

  deps:
    desc: Install required dependencies if not already present
    cmds:
      - echo "Checking dependencies..."
      - |
        # Helper to check and install Go tools
        install_if_missing() {
          local tool=$1
          local pkg=$2
          if ! command -v "$tool" >/dev/null 2>&1; then
            echo "Installing $tool..."
            go install "$pkg"
          else
            echo "$tool already installed"
          fi
        }

        # Check Go tools (pinned versions)
        install_if_missing protoc-gen-go google.golang.org/protobuf/cmd/protoc-gen-go@v1.34.1
        install_if_missing protoc-gen-go-grpc google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.3.0
        install_if_missing goose github.com/pressly/goose/v3/cmd/goose@v3.21.1
        install_if_missing templ github.com/a-h/templ/cmd/templ@v0.2.747

        # Check protobuf-compiler
        if ! command -v protoc >/dev/null 2>&1; then
          echo "Installing protobuf-compiler..."
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y protobuf-compiler
          elif command -v brew >/dev/null 2>&1; then
            brew install protobuf
          else
            echo "Please install protobuf-compiler manually for your system"
            exit 1
          fi
        else
          echo "protobuf-compiler already installed"
        fi

        # Download Go module dependencies only if needed
        if [ ! -f go.sum ] || [ go.mod -nt go.sum ]; then
          echo "Running go mod download..."
          go mod download
        else
          echo "Go modules up to date"
        fi

        echo "Dependencies check completed"


  gen-proto:
    desc: Generate protobuf code
    deps: [deps]
    sources:
      - internal/gen/signer.proto
    generates:
      - internal/gen/signer.pb.go
      - internal/gen/signer_grpc.pb.go
    cmds:
      - echo "Generating protobuf code..."
      - protoc --go_out=. --go_opt=paths=source_relative --go-grpc_out=. --go-grpc_opt=paths=source_relative --experimental_allow_proto3_optional internal/gen/signer.proto

  gen-templ:
    desc: Generate Go code from templ files
    deps: [deps]
    sources:
      - internal/routes/admin/templates/*.templ
      - internal/routes/admin/templates/*.html
    generates:
      - internal/routes/admin/templates/*.go
    cmds:
      - echo "Generating Go code from templ files..."
      - templ generate internal/routes/admin/templates/

  run:
    desc: Build and run the application locally
    deps: [build]
    cmds:
      - echo "Running {{.APP_NAME}} v{{.VERSION}} locally..."
      - ./{{.BUILD_DIR}}/{{.APP_NAME}} {{.RUN_ARGS}}
    silent: true

  dev:
    desc: Start database and run application locally (recommended dev setup)
    deps: [docker-db]
    env:
      DATABASE_URL: "postgres://nutmix:admin@localhost:5432/nutmix"
      POSTGRES_HOST: "localhost"
      POSTGRES_PORT: "5432"
    cmds:
      - echo "Starting development environment..."
      - task: run
    # Note: The database will continue running after the app exits.
    # Use 'task docker-db-down' to stop it separately.

  gen-test-keys:
    desc: Generate test keys for MINT_PRIVATE_KEY
    cmds:
      - echo "MINT_PRIVATE_KEY=$(openssl rand -hex 32)"
      - echo "use the npub generated below for ADMIN_NOSTR_NPUB"
      - go run ./cmd/gen_nostr_key
    silent: true

  test:
    desc: Run tests
    cmds:
      - echo "Running tests..."
      - go test -v ./...

  lint:
    desc: Run linter
    cmds:
      - echo "Running linter..."
      - golangci-lint run

  clean:
    desc: Clean build artifacts
    cmds:
      - echo "Cleaning..."
      - rm -rf {{.BUILD_DIR}}

  # Docker Tasks with Version Support
  docker-build:
    desc: Build Docker image with version tags
    deps:
      - build
    cmds:
      - echo "Building Docker image for {{.APP_NAME}} v{{.VERSION}}..."
      - docker build -t {{.DOCKER_IMAGE}}:latest -t {{.DOCKER_IMAGE}}:{{.VERSION}} .

  docker-run:
    desc: Run application in Docker
    deps:
      - docker-build
    cmds:
      - echo "Running {{.APP_NAME}} v{{.VERSION}} in Docker..."
      - docker run --rm -p 8080:8080 {{.DOCKER_IMAGE}}:{{.VERSION}}

  docker-push:
    desc: Push Docker images to registry
    deps:
      - docker-build
    cmds:
      - echo "Pushing Docker images for {{.APP_NAME}} v{{.VERSION}}..."
      - docker push {{.DOCKER_IMAGE}}:latest
      - docker push {{.DOCKER_IMAGE}}:{{.VERSION}}

  docker-clean:
    desc: Clean up Docker resources
    cmds:
      - echo "Cleaning up Docker resources..."
      - docker rmi -f {{.DOCKER_IMAGE}}:latest || true
      - docker rmi -f {{.DOCKER_IMAGE}}:{{.VERSION}} || true

  # Docker Compose Tasks
  docker-up:
    desc: Start all services with docker-compose
    cmds:
      - echo "Starting all services with docker-compose..."
      - export UID=$(id -u) && export GID=$(id -g) && docker compose up -d

  docker-down:
    desc: Stop all services
    cmds:
      - echo "Stopping all services..."
      - docker compose down

  docker-db:
    desc: Start only the database service using docker-compose-dev.yml
    cmds:
      - echo "Starting database service..."
      - docker compose -f docker-compose-dev.yml up -d db

  docker-db-down:
    desc: Stop the database service using docker-compose-dev.yml
    cmds:
      - echo "Stopping database service..."
      - docker compose -f docker-compose-dev.yml down db
